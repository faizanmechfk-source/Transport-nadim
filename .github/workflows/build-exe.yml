name: Build Windows .EXE Desktop App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web App Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application (Vite Production Build)
        run: npm run build

      - name: Prepare Desktop Dist Assets
        run: node scripts/prepare-desktop.cjs

      - name: Install Desktop / Electron Dependencies
        working-directory: desktop
        run: npm install --legacy-peer-deps

      - name: Package Windows .EXE (NSIS Setup & Portable)
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: List Generated Build Files
        shell: bash
        run: |
          echo "=== Generated Build Artifacts ==="
          ls -la desktop/release/

      - name: Upload Windows .EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Transport-Entry-Windows-EXE
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (On Tag Push or Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
