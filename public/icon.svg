<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle glow / shield outline -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Truck Cab and Cargo Container Body -->
  <g transform="translate(64, 110)">
    <!-- Cargo Box / Container -->
    <rect x="20" y="50" width="220" height="170" rx="16" fill="url(#truckGrad)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))"/>
    <!-- Container Ridges -->
    <line x1="75" y1="65" x2="75" y2="205" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="130" y1="65" x2="130" y2="205" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="185" y1="65" x2="185" y2="205" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

    <!-- Cab Body -->
    <path d="M 245 100 L 310 100 Q 340 100 350 130 L 365 175 Q 370 190 370 205 L 370 220 L 245 220 Z" fill="url(#truckGrad)"/>
    <!-- Windshield -->
    <path d="M 260 115 L 305 115 Q 325 115 332 135 L 342 165 L 260 165 Z" fill="#0284c7"/>
    <!-- Headlight -->
    <rect x="355" y="195" width="16" height="16" rx="4" fill="url(#goldGrad)"/>
    <!-- Bumper -->
    <rect x="240" y="215" width="138" height="15" rx="6" fill="#334155"/>

    <!-- Wheel Wells & Wheels -->
    <!-- Rear Dual Wheel -->
    <circle cx="85" cy="225" r="38" fill="#0f172a"/>
    <circle cx="85" cy="225" r="22" fill="#64748b"/>
    <circle cx="85" cy="225" r="10" fill="#f8fafc"/>

    <circle cx="175" cy="225" r="38" fill="#0f172a"/>
    <circle cx="175" cy="225" r="22" fill="#64748b"/>
    <circle cx="175" cy="225" r="10" fill="#f8fafc"/>

    <!-- Front Wheel -->
    <circle cx="315" cy="225" r="38" fill="#0f172a"/>
    <circle cx="315" cy="225" r="22" fill="#64748b"/>
    <circle cx="315" cy="225" r="10" fill="#f8fafc"/>

    <!-- Road Line -->
    <rect x="0" y="260" width="384" height="12" rx="6" fill="rgba(255,255,255,0.4)"/>
    <rect x="40" y="280" width="60" height="6" rx="3" fill="rgba(255,255,255,0.6)"/>
    <rect x="140" y="280" width="60" height="6" rx="3" fill="rgba(255,255,255,0.6)"/>
    <rect x="240" y="280" width="60" height="6" rx="3" fill="rgba(255,255,255,0.6)"/>

    <!-- Fast Lightning / Speed Lines -->
    <path d="M 10 90 L 35 125 L 20 130 L 45 170" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Offline Badge Ribbon -->
  <g transform="translate(146, 420)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <circle cx="28" cy="21" r="8" fill="#10b981"/>
    <text x="46" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="1.5">OFFLINE READY</text>
  </g>
</svg>
